  <meta name="description"
    content="Rubavu Today ni urubuga rw'itangazamakuru rutanga amakuru agezweho, yizewe kandi afitiye akamaro abasomyi bo mu Rwanda, muri Afurika no ku isi hose. Dutangaza amakuru n'inkuru zitandukanye zirimo politiki, ubukungu, ubucuruzi, imikino, imyidagaduro, uburezi, ikoranabuhanga, ubuzima, umuco, sosiyete, ubukerarugendo, ibidukikije ndetse n'amakuru mpuzamahanga. Rubavu Today igamije kugeza ku basomyi amakuru y'ingenzi ku gihe, mu buryo bwumvikana kandi bw'umwuga, kugira ngo buri wese abashe gukurikirana ibibera mu gihugu, muri Afurika no hirya no hino ku isi." />
